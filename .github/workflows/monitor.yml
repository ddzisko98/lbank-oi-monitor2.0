name: Monitor CXMTUSDT Open Interest

on:
  schedule:
    # Кожні 5 хвилин.
    # тому не варто ставити занадто часто на безкоштовному тарифі).
   # - cron: "*/5 * * * *"
  workflow_dispatch: {}  # дозволяє запустити вручну кнопкою "Run workflow"

permissions:
  contents: write  # потрібно, щоб коммітити state.json назад у репо

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save state back to repo
        run: |
          git config user.name "oi-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update OI state [skip ci]"
          git push
